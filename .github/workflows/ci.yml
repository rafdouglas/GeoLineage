name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Security scan with bandit
        run: bandit -r lineage_core/ lineage_retrieval/ lineage_viewer/ lineage_manager/ -q

      - name: Run T1 tests with coverage
        # No PYTHONPATH env var needed: tests/conftest.py handles import
        # resolution via sys.path manipulation (adds the project root).
        run: >
          pytest tests/ -v
          --cov=lineage_core
          --cov=lineage_retrieval
          --cov-report=term-missing
          --cov-fail-under=50

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  qt6-compat:
    # Guard against Qt5-only spellings (unscoped enums, exec_, PyQt5 imports)
    # creeping back in. Runs the official QGIS migration script in dry-run
    # mode; any reported change fails the job. Without the qgis module the
    # script only checks Qt enums, which is enough for a guard.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt runtime libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: Install PyQt6 and script dependencies
        run: pip install PyQt6 PyQt6-QScintilla astpretty tokenize-rt

      - name: Fetch pyqt5_to_pyqt6.py from QGIS
        run: curl -sSL -o pyqt5_to_pyqt6.py https://raw.githubusercontent.com/qgis/QGIS/master/scripts/pyqt5_to_pyqt6/pyqt5_to_pyqt6.py

      - name: Check for Qt5-only code
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python pyqt5_to_pyqt6.py --dry_run . 2>&1 | grep -v "QGIS classes not available" | tee qt6-findings.txt
          if grep -q . qt6-findings.txt; then
            echo "::error::Qt5-only code found; use scoped enums / exec() (see docs/qgis4-migration-strategy.md)"
            exit 1
          fi

  # -----------------------------------------------------------
  # SPLIT-POINT: Extract release into .github/workflows/release.yml
  # when T2 QGIS tests are added (to keep test and release triggers
  # independent).
  # -----------------------------------------------------------

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin ZIP
        # release.sh is called without flags (ZIP-only mode).
        # The --upload flag exists for manual QGIS repo uploads
        # but is not used in CI.
        run: bash scripts/release.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/GeoLineage-*.zip
          generate_release_notes: true
          draft: false
